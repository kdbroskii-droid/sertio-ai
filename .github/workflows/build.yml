name: Build Nova Studio AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add native platform scaffolding
        run: flutter create --platforms=android,windows --org ai.novastudio --project-name nova_studio_ai --no-pub .
      - run: flutter pub get
      - name: Set Android compile SDK for app and plugins
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle.kts")
          app_text = app_gradle.read_text()
          app_text = app_text.replace(
              "compileSdk = flutter.compileSdkVersion",
              "compileSdk = 36",
          )
          app_gradle.write_text(app_text)

          plugin_root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          updated = []
          if plugin_root.exists():
              for gradle in plugin_root.glob("*/android/build.gradle*"):
                  original = gradle.read_text()
                  patched = re.sub(
                      r"compileSdkVersion\\s+34\\b",
                      "compileSdkVersion 36",
                      original,
                  )
                  patched = re.sub(
                      r"compileSdk\\s*=\\s*34\\b",
                      "compileSdk = 36",
                      patched,
                  )
                  if patched != original:
                      gradle.write_text(patched)
                      updated.append(str(gradle))
          print("Updated plugin Gradle files:", updated)
          PY
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nova-studio-ai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add native platform scaffolding
        run: flutter create --platforms=android,windows --org ai.novastudio --project-name nova_studio_ai --no-pub .
      - run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nova-studio-ai-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: nova-studio-ai-windows
          path: nova-studio-ai-windows.zip
          if-no-files-found: error
