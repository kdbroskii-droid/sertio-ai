name: Build Nova Studio AI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add native platform scaffolding
        run: flutter create --platforms=android,windows --org ai.novastudio --project-name nova_studio_ai --no-pub .
      - run: flutter pub get
      - name: Set Android compile SDK for app and plugins
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_gradle = Path("android/app/build.gradle.kts")
          app_text = app_gradle.read_text()
          app_text = re.sub(
              r"compileSdk\s*(?:=\s*)?flutter\.compileSdkVersion",
              "compileSdk = 36",
              app_text,
          )
          app_text = re.sub(
              r"compileSdkVersion\s+flutter\.compileSdkVersion",
              "compileSdkVersion 36",
              app_text,
          )
          app_gradle.write_text(app_text)

          plugin_root = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          updated = []
          checked = 0
          if plugin_root.exists():
              for gradle in plugin_root.rglob("build.gradle*"):
                  if "android" not in gradle.parts:
                      continue
                  checked += 1
                  original = gradle.read_text()
                  # Handle Groovy and Kotlin DSL forms, including "compileSdk 34".
                  patched = re.sub(
                      r"(compileSdkVersion\s+|compileSdk\s*(?:=\s*)?)(?:flutter\.compileSdkVersion|\d+)",
                      lambda match: match.group(1) + "36",
                      original,
                  )
                  if patched != original:
                      gradle.write_text(patched)
                      updated.append(str(gradle))
          print(f"Inspected {checked} Android plugin Gradle files.")
          print("Updated plugin Gradle files:", updated)
          picker_gradle = plugin_root / "file_picker-8.3.7" / "android" / "build.gradle"
          if picker_gradle.exists():
              picker_text = picker_gradle.read_text()
              print("file_picker compileSdk lines:", [
                  line.strip() for line in picker_text.splitlines()
                  if "compileSdk" in line
              ])
              if not any("file_picker-8.3.7/android/build.gradle" in path for path in updated):
                  # Explicit fallback for file_picker's Groovy Gradle file.
                  picker_text = re.sub(
                      r"(compileSdkVersion\s+|compileSdk\s*)(?:flutter\.compileSdkVersion|\d+)",
                      lambda match: match.group(1) + "36",
                      picker_text,
                  )
                  picker_gradle.write_text(picker_text)
                  print("Applied explicit file_picker compile SDK fallback.")
          PY
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: nova-studio-ai-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    name: Windows desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Add native platform scaffolding
        run: flutter create --platforms=android,windows --org ai.novastudio --project-name nova_studio_ai --no-pub .
      - run: flutter pub get
      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter test
      - run: flutter build windows --release
      - name: Package Windows release
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath nova-studio-ai-windows.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: nova-studio-ai-windows
          path: nova-studio-ai-windows.zip
          if-no-files-found: error
